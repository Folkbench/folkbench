name: Commit convention
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
jobs:
  commit-message:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node scripts/check-commit-message.mjs --public --ci
      - run: node --test scripts/check-commit-message.test.mjs
