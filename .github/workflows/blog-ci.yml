name: Blog checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      blog: ${{ steps.areas.outputs.blog }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - id: areas
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-areas.mjs
  blog:
    needs: changes
    if: needs.changes.outputs.blog == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:source
      - run: bun run test:repository-tools
      - run: bun run check:blog
      - run: bun run build:blog
  gate:
    name: Blog gate
    if: always()
    needs: [changes, blog]
    runs-on: ubuntu-22.04
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          BLOG: ${{ needs.blog.result }}
        run: test "$CHANGES" = success && { test "$BLOG" = success || test "$BLOG" = skipped; }
