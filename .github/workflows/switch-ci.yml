name: Switch checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: switch-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      switch: ${{ steps.areas.outputs.switch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - id: areas
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-areas.mjs
  frontend:
    needs: changes
    if: needs.changes.outputs.switch == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Mark isolated CI development host
        run: touch apps/switch/.folkbench-switch-development-host
      - run: bun install --cwd apps/switch --frozen-lockfile
      - run: bun run check:source
      - run: bun run test:repository-tools
      - run: bun run check:switch
      - run: bun run build:switch:web
  rust:
    needs: changes
    if: needs.changes.outputs.switch == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Frontend placeholder for native tests
        shell: bash
        run: mkdir -p apps/switch/dist
      - run: cargo fmt --all --check --manifest-path apps/switch/src-tauri/Cargo.toml
      - run: cargo check --workspace --locked --manifest-path apps/switch/src-tauri/Cargo.toml
      - run: cargo test --workspace --locked --manifest-path apps/switch/src-tauri/Cargo.toml
  gate:
    name: Switch gate
    if: always()
    needs: [changes, frontend, rust]
    runs-on: ubuntu-22.04
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          test "$CHANGES" = success
          test "$FRONTEND" = success || test "$FRONTEND" = skipped
          test "$RUST" = success || test "$RUST" = skipped
