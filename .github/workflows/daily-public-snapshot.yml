name: Daily public snapshot distribution
on:
  schedule:
    - cron: '50 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-public-snapshot
  cancel-in-progress: false
jobs:
  distribute:
    if: github.repository == 'Folkbench/folkbench' && github.ref == 'refs/heads/main' && vars.PUBLIC_DISTRIBUTION_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Folkbench/folkbench-data
          persist-credentials: false
          path: distribution-data
          fetch-depth: 0
      - name: Prepare normal Git hooks
        run: |
          git config core.hooksPath .githooks
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Update only the README marker block
        id: readme
        run: bun scripts/distribution/cli.ts readme --root . --data-root distribution-data
      - name: Prepare existing public-repository hook dependencies
        if: steps.readme.outputs.changed == 'true'
        run: |
          bun install --frozen-lockfile
          touch apps/switch/.folkbench-switch-development-host
          bun install --cwd apps/switch --frozen-lockfile
      - name: Commit and push README through existing hooks
        if: steps.readme.outputs.changed == 'true'
        env:
          SNAPSHOT_VERSION: ${{ steps.readme.outputs.snapshot_version }}
        run: |
          test "$(git config --get core.hooksPath)" = .githooks
          git add README.md
          git commit -m "数据：更新每日公开快照（快照 ${SNAPSHOT_VERSION}）"
          git push origin HEAD:main
      - name: Notify after two failed scheduled days
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/distribution/cli.ts failure-alert --root . --repo Folkbench/folkbench --workflow daily-public-snapshot.yml
