name: Switch Beta candidate and release
on:
  push:
    tags: ['switch-v*-beta.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Matching switch-vX.Y.Z-beta.N tag; leave empty for a development build'
        type: string
        required: false
      mode:
        description: 'Publication requires completed policy, signing credentials and platform QA'
        type: choice
        options: [build-only, signed-candidate, publish-beta]
        default: build-only
        required: true
permissions:
  contents: read
concurrency:
  group: switch-beta-${{ github.event_name }}-${{ inputs.tag || github.ref_name }}-${{ inputs.mode || 'build-only' }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Folkbench/folkbench'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      mode: ${{ steps.release.outputs.mode }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Validate Beta identity and release approval
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'build-only' }}
        run: |
          set -euo pipefail
          node apps/switch/scripts/release.mjs "$REQUESTED_TAG" "$REQUESTED_MODE" > "$RUNNER_TEMP/switch-release.json"
          version=$(node -p "require(process.env.RUNNER_TEMP + '/switch-release.json').version")
          tag=$(node -p "require(process.env.RUNNER_TEMP + '/switch-release.json').tag")
          if [ "$REQUESTED_MODE" != 'build-only' ]; then
            test -n "$REQUESTED_TAG"
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
            git merge-base --is-ancestor HEAD origin/main
          fi
          printf 'version=%s\ntag=%s\nmode=%s\ncommit=%s\n' "$version" "$tag" "$REQUESTED_MODE" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node --test apps/switch/scripts/*.test.mjs
      - run: node scripts/check-source-hygiene.mjs
  build:
    needs: validate
    environment: ${{ needs.validate.outputs.mode == 'build-only' && 'switch-build' || 'switch-beta' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15
            platform: macos-x64
            target: x86_64-apple-darwin
            bundle: dmg
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      FOLKBENCH_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Mark isolated CI host and install dependencies
        shell: bash
        run: |
          touch apps/switch/.folkbench-switch-development-host
          bun install --cwd apps/switch --frozen-lockfile
      - run: bun run check:switch
      - run: cargo fmt --all --check --manifest-path apps/switch/src-tauri/Cargo.toml
      - run: cargo test --workspace --locked --manifest-path apps/switch/src-tauri/Cargo.toml
      - name: Import Apple Developer ID into a temporary CI keychain
        if: runner.os == 'macOS' && needs.validate.outputs.mode != 'build-only'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing required Apple release credential: $name"; exit 1; }
          done
          [[ "$APPLE_SIGNING_IDENTITY" == 'Developer ID Application:'* ]]
          signing_password=$(openssl rand -hex 24)
          echo "::add-mask::$signing_password"
          signing_keychain="$RUNNER_TEMP/folkbench-switch-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$RUNNER_TEMP/folkbench-switch-signing.p12"
          chmod 600 "$RUNNER_TEMP/folkbench-switch-signing.p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security import "$RUNNER_TEMP/folkbench-switch-signing.p12" -k "$signing_keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$signing_keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain"
      - name: Build installer
        shell: bash
        working-directory: apps/switch
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && (needs.validate.outputs.mode == 'build-only' && '-' || secrets.APPLE_SIGNING_IDENTITY) || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && needs.validate.outputs.mode != 'build-only' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && needs.validate.outputs.mode != 'build-only' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && needs.validate.outputs.mode != 'build-only' && secrets.APPLE_TEAM_ID || '' }}
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
        run: bun run tauri build --target "$TARGET" --bundles "$BUNDLE"
      - name: Notarize and verify the macOS distribution
        if: runner.os == 'macOS' && needs.validate.outputs.mode != 'build-only'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="apps/switch/src-tauri/target/$TARGET/release/bundle"
          app="$bundle/macos/Folkbench Switch.app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          shopt -s nullglob
          installers=("$bundle"/dmg/*.dmg)
          test "${#installers[@]}" -eq 1
          xcrun notarytool submit "${installers[0]}" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RUNNER_TEMP/switch-notarization.json"
          node -e "if (require(process.env.RUNNER_TEMP + '/switch-notarization.json').status !== 'Accepted') process.exit(1)"
          xcrun stapler staple "${installers[0]}"
          xcrun stapler validate "${installers[0]}"
      - name: Collect only installers and public build metadata
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MODE: ${{ needs.validate.outputs.mode }}
        run: node apps/switch/scripts/artifacts.mjs collect "$PLATFORM" "$MODE" .release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: switch-${{ matrix.platform }}-${{ needs.validate.outputs.commit }}
          path: .release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary Apple credential material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/folkbench-switch-signing.keychain-db" 2>/dev/null || true
          rm -f -- "$RUNNER_TEMP/folkbench-switch-signing.p12" "$RUNNER_TEMP/switch-notarization.json"
  publish:
    if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.mode == 'publish-beta'
    needs: [validate, build]
    environment: switch-beta
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      FOLKBENCH_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: switch-*-${{ needs.validate.outputs.commit }}
          path: .release-artifacts
          merge-multiple: true
      - name: Verify complete platform set, source version and installer hashes
        run: node apps/switch/scripts/artifacts.mjs verify .release-artifacts publish-beta
      - name: Publish an approved Beta, never Latest or Stable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already has a Release. Do not overwrite it; create a new Beta version.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" .release-artifacts/* --draft --prerelease --target "$SOURCE_COMMIT" --title "Folkbench Switch $VERSION" --notes-file docs/switch/CHANGELOG.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
