[package]
name = "folkbench-switch-contract"
version = "0.0.1"
description = "Serializable MF Switch wire types shared by the Rust core and the generated TypeScript bridge"
authors = ["MF Switch contributors"]
license = "Apache-2.0"
repository = "https://github.com/Folkbench/Folkbench-switch"
edition = "2024"
rust-version = "1.88"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true, default-features = false, features = [
  "serde-compat",
] }

[features]
generate-bindings = ["dep:ts-rs"]
