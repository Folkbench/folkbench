<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img"><rect width="1280" height="260" rx="16" fill="#fff"/><g font-family="Noto Sans CJK SC,Noto Sans CJK JP,Arial,sans-serif"><text x="42" y="42" font-size="23" fill="#171717" font-weight="500">利用の流れ</text><text x="42" y="69" font-size="14" fill="#697386" font-weight="400">Web で公開情報を比較し、ツールの設定はローカルで管理。</text><rect x="42" y="106" width="368" height="120" rx="12" fill="#F7F9FC" stroke="#E3E8EE"/><text x="64" y="139" font-size="12" fill="#533AFD" font-weight="500">01</text><text x="64" y="172" font-size="23" fill="#171717" font-weight="500">測定結果を見る</text><text x="64" y="201" font-size="14" fill="#425466" font-weight="400">モデルと回線を選ぶ</text><text x="421" y="171" font-size="20" fill="#87909F" font-weight="400">→</text><rect x="444" y="106" width="368" height="120" rx="12" fill="#F7F9FC" stroke="#E3E8EE"/><text x="466" y="139" font-size="12" fill="#533AFD" font-weight="500">02</text><text x="466" y="172" font-size="23" fill="#171717" font-weight="500">比較する</text><text x="466" y="201" font-size="14" fill="#425466" font-weight="400">モニターと公開情報を確認</text><text x="823" y="171" font-size="20" fill="#87909F" font-weight="400">→</text><rect x="846" y="106" width="368" height="120" rx="12" fill="#F7F9FC" stroke="#E3E8EE"/><text x="868" y="139" font-size="12" fill="#533AFD" font-weight="500">03</text><text x="868" y="172" font-size="23" fill="#171717" font-weight="500">Switch で接続</text><text x="868" y="201" font-size="14" fill="#425466" font-weight="400">差分を確認して適用</text></g></svg>