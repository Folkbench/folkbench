<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img"><rect width="1280" height="260" rx="16" fill="#ffffff"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif"><text x="42" y="42" font-size="23" fill="#171717" font-weight="500">从发现，到接入。</text><text x="42" y="69" font-size="14" fill="#697386" font-weight="400">在网页比较公开信息，在本地管理工具配置。</text><rect x="42" y="106" width="368" height="120" rx="12" fill="#F7F9FC" stroke="#E3E8EE"/><text x="64" y="139" font-size="12" fill="#533AFD" font-weight="500">01</text><text x="64" y="172" font-size="24" fill="#171717" font-weight="500">看实测</text><text x="64" y="201" font-size="14" fill="#425466" font-weight="400">在榜单中选择模型与线路</text><text x="421" y="171" font-size="20" fill="#87909F" font-weight="400">→</text><rect x="444" y="106" width="368" height="120" rx="12" fill="#F7F9FC" stroke="#E3E8EE"/><text x="466" y="139" font-size="12" fill="#533AFD" font-weight="500">02</text><text x="466" y="172" font-size="24" fill="#171717" font-weight="500">做比较</text><text x="466" y="201" font-size="14" fill="#425466" font-weight="400">查看监控与站点公开信息</text><text x="823" y="171" font-size="20" fill="#87909F" font-weight="400">→</text><rect x="846" y="106" width="368" height="120" rx="12" fill="#F7F9FC" stroke="#E3E8EE"/><text x="868" y="139" font-size="12" fill="#533AFD" font-weight="500">03</text><text x="868" y="172" font-size="24" fill="#171717" font-weight="500">用 Switch</text><text x="868" y="201" font-size="14" fill="#425466" font-weight="400">预览差异，再应用到工具</text></g></svg>