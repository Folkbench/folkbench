<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title"><title id="title">작업 1회의 총비용부터 계산</title><rect width="1080" height="620" fill="#f6f6f3"/><text x="36" y="54" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#425466">KIMI K3.1 PRO</text><text x="36" y="108" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="34" font-weight="600" fill="#171717">작업 1회의 총비용부터 계산</text><text x="36" y="151" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#425466">실제 청구 항목별로 집계하고 같은 토큰을 두 번 계산하지 않습니다</text><rect x="36" y="198" width="234" height="116" rx="12" fill="white" stroke="#dae1e9"/><g transform="translate(56 216)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-check"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="m9 15 2 2 4-4"></path></svg></g><text x="56" y="287" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="22" font-weight="500" fill="#171717">캐시 미적중 입력</text><rect x="294" y="198" width="234" height="116" rx="12" fill="white" stroke="#dae1e9"/><g transform="translate(314 216)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-database"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg></g><text x="314" y="287" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="22" font-weight="500" fill="#171717">캐시 쓰기</text><rect x="552" y="198" width="234" height="116" rx="12" fill="white" stroke="#dae1e9"/><g transform="translate(572 216)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></g><text x="572" y="287" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="22" font-weight="500" fill="#171717">캐시 읽기</text><rect x="810" y="198" width="234" height="116" rx="12" fill="white" stroke="#dae1e9"/><g transform="translate(830 216)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg></g><text x="830" y="287" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="22" font-weight="500" fill="#171717">모델 출력</text><path d="M540 334v42m-8-8 8 8 8-8" stroke="#425466" fill="none" stroke-width="2"/><text x="36" y="425" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#425466">모든 시도를 합산: 모델 청구액 + 도구 / 실행 환경</text><path d="M36 458h1008" stroke="#dae1e9"/><text x="36" y="522" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="38" font-weight="600" fill="#171717">총지출 ÷ 검수를 통과한 작업 수</text><text x="36" y="585" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Inter, Noto Sans CJK SC, Noto Sans SC, DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425466">실패한 재시도 비용도 포함합니다. 모두 실패하면 성공 작업당 단가는 보고하지 않습니다.</text></svg>
