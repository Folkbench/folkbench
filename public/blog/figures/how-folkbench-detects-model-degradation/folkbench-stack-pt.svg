<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title"><title id="title">Da avaliação estática à verificação contínua de entrega</title><rect width="1080" height="610" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">FIG 05 · CICLO COMPLETO FOLKBENCH</text><text x="36" y="86" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Da avaliação estática à verificação contínua de entrega</text><text x="36" y="118" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">Integrando rankings granulares, auditoria de degradação, comparação e troca local segura.</text><rect x="36" y="144" width="1008" height="78" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="52" y="156" width="276" height="54" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><text x="66" y="179" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="600" fill="#425466" text-anchor="start">Rankings de modelos</text><text x="66" y="199" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#697386" text-anchor="start">Só teto teórico oficial</text><rect x="342" y="156" width="276" height="54" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><text x="356" y="179" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="600" fill="#425466" text-anchor="start">Diretórios básicos</text><text x="356" y="199" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#697386" text-anchor="start">Só preço e ping HTTP 200</text><path d="M630 183h24m-5-5 5 5-5 5" stroke="#171717" stroke-width="1.8" fill="none"/><rect x="666" y="156" width="362" height="54" rx="8" fill="#171717"/><text x="682" y="179" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Auditoria real Folkbench</text><text x="682" y="199" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#d4dee9" text-anchor="start">Monitoramento contínuo por Modelo × Grupo</text><rect x="36" y="244" width="234" height="276" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="52" y="262" width="166" height="22" rx="6" fill="#f1f4f8"/><text x="60" y="277" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#425466" text-anchor="start">01 · FILTRAR</text><text x="52" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">4 Rankings públicos</text><text x="52" y="336" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#697386" text-anchor="start">/rankings*</text><line x1="52" y1="352" x2="254" y2="352" stroke="#e3e8ee"/><text x="52" y="378" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Disponibilidade sem falso 200</text><text x="52" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Estabilidade em carga contínua</text><text x="52" y="440" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Latência (TTFT vs geração)</text><text x="52" y="471" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Custo real por sessão prática</text><path d="M273 382h16m-4-4 4 4-4 4" stroke="#87909f" stroke-width="1.5" fill="none"/><rect x="294" y="244" width="234" height="276" rx="12" fill="#ffffff" stroke="#533AFD" stroke-width="1.5"/><defs><clipPath id="cp2"><rect x="294" y="244" width="234" height="276" rx="12"/></clipPath></defs><rect x="294" y="244" width="234" height="4" fill="#533AFD" clip-path="url(#cp2)"/><rect x="310" y="262" width="166" height="22" rx="6" fill="#efedff"/><text x="318" y="277" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="start">02 · AUDITAR  NEW</text><text x="310" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Monitor Integridade</text><text x="310" y="336" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#697386" text-anchor="start">/arena</text><line x1="310" y1="352" x2="512" y2="352" stroke="#e3e8ee"/><text x="310" y="378" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Sondas dinâmicas atualidade</text><text x="310" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Impressão digital e raciocínio</text><text x="310" y="440" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Calibração oficial direta</text><text x="310" y="471" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Limites amostrais explícitos</text><path d="M531 382h16m-4-4 4 4-4 4" stroke="#87909f" stroke-width="1.5" fill="none"/><rect x="552" y="244" width="234" height="276" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="568" y="262" width="166" height="22" rx="6" fill="#f1f4f8"/><text x="576" y="277" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#425466" text-anchor="start">03 · COMPARAR</text><text x="568" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Comparar Relays</text><text x="568" y="336" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#697386" text-anchor="start">/stations/compare</text><line x1="568" y1="352" x2="770" y2="352" stroke="#e3e8ee"/><text x="568" y="378" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Auditoria lado a lado por grupo</text><text x="568" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Separa pools VIP e promocionais</text><text x="568" y="440" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Evita máscara por média global</text><path d="M789 382h16m-4-4 4 4-4 4" stroke="#87909f" stroke-width="1.5" fill="none"/><rect x="810" y="244" width="234" height="276" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="826" y="262" width="166" height="22" rx="6" fill="#f1f4f8"/><text x="834" y="277" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#425466" text-anchor="start">04 · TROCAR</text><text x="826" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Folkbench Switch</text><text x="826" y="336" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#697386" text-anchor="start">Cliente Open Source</text><line x1="826" y1="352" x2="1028" y2="352" stroke="#e3e8ee"/><text x="826" y="378" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Prévia de diff antes de gravar</text><text x="826" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Proteção OAuth para Codex</text><text x="826" y="440" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Rotas públicas e uso local</text><rect x="36" y="536" width="1008" height="48" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><text x="52" y="565" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="500" fill="#425466" text-anchor="start">Limite arquitetural: Monitoramento de integridade e cache rodam na web; o Switch cuida de configs locais e rotas públicas.</text></svg>
