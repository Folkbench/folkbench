<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="766" viewBox="0 0 1080 766" role="img" aria-labelledby="title"><title id="title">Kiến trúc probe thời sự &amp; dấu vân tay với hiệu chuẩn chính hãng song song</title><rect width="1080" height="766" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">HÌNH 03 · KIẾN TRÚC PROBE KÉP</text><text x="36" y="86" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Kiến trúc probe thời sự &amp; dấu vân tay với hiệu chuẩn chính hãng song song</text><text x="36" y="118" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">Kiểm chứng đồng thời năng lực hiểu biết mới nhất và thông số giao thức trong cùng một chu kỳ.</text><defs><clipPath id="cd1"><rect x="36" y="146" width="492" height="204" rx="12"/></clipPath><clipPath id="cd2"><rect x="552" y="146" width="492" height="204" rx="12"/></clipPath><clipPath id="cconv"><rect x="36" y="624" width="1008" height="110" rx="12"/></clipPath></defs><rect x="36" y="146" width="492" height="204" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="36" y="146" width="492" height="4" fill="#533AFD" clip-path="url(#cd1)"/><rect x="56" y="166" width="300" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="66" y="182" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="start">CHIỀU 01 · CẬP NHẬT LIÊN TỤC</text><text x="56" y="218" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">Probe thời sự</text><text x="56" y="246" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Đưa mốc thời gian sự kiện thực tế mới nhất và điều</text><text x="56" y="268" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">kiện cập nhật vào chuỗi bài toán suy luận có cấu trúc.</text><rect x="56" y="296" width="220" height="36" rx="7" fill="#f7f9fc" stroke="#e3e8ee"/><text x="166" y="318" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#171717" text-anchor="middle">Chặn cache tĩnh &amp; danh sách trắng</text><rect x="288" y="296" width="220" height="36" rx="7" fill="#f7f9fc" stroke="#e3e8ee"/><text x="398" y="318" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#171717" text-anchor="middle">Lộ bản cũ và mô hình nén quá mức</text><rect x="552" y="146" width="492" height="204" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="552" y="146" width="492" height="4" fill="#533AFD" clip-path="url(#cd2)"/><rect x="572" y="166" width="300" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="582" y="182" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="start">CHIỀU 02 · HÀNH VI &amp; THÔNG SỐ</text><text x="572" y="218" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">Probe dấu vân tay mô hình</text><text x="572" y="244" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Đo thói quen tuân thủ ràng buộc nhiều bước cùng</text><text x="572" y="265" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">các dấu hiệu kỹ thuật do endpoint trả về:</text><rect x="572" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="644.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Tỷ lệ khớp</text><rect x="726" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="798.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Token vào</text><rect x="880" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="952.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Token suy luận</text><rect x="572" y="310" width="220" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="682.0" y="327" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Dấu vân tay</text><rect x="804" y="310" width="220" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="914.0" y="327" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Kiểm tra cache</text><path d="M282 350v22M798 350v22M282 372h516" stroke="#87909f" stroke-width="1.5" fill="none"/><path d="M282 372v36m-5-6 5 6 5-6" stroke="#159570" stroke-width="1.7" fill="none"/><path d="M798 372v36m-5-6 5 6 5-6" stroke="#425466" stroke-width="1.7" fill="none"/><rect x="332" y="357" width="416" height="30" rx="15" fill="#171717"/><text x="540" y="376" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="6