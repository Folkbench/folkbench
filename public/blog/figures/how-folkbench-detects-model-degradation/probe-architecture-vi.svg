stroke="#dae1e9" stroke-width="1.2"/><rect x="572" y="432" width="246" height="22" rx="6" fill="#425466"/><text x="582" y="447" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">LUỒNG TRẠM ĐANG ĐO</text><text x="572" y="480" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">Tuyến trung chuyển (Mô hình × Nhóm dịch vụ)</text><rect x="572" y="496" width="136" height="40" rx="8" fill="#f7f9fc" stroke="#c5cfdb"/><text x="640.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Cùng bộ probe</text><path d="M708 516h20m-4-4 4 4-4 4" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="730" y="496" width="136" height="40" rx="8" fill="#f7f9fc" stroke="#c5cfdb"/><text x="798.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Định tuyến nhóm</text><path d="M866 516h20m-4-4 4 4-4 4" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="888" y="496" width="136" height="40" rx="8" fill="#ffffff" stroke="#c5cfdb"/><text x="956.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Trả lời + chỉ số</text><text x="572" y="568" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#425466" text-anchor="start">Đo độc lập theo từng mô hình và nhóm dịch vụ cụ thể.</text><path d="M282 588v16M798 588v16M282 604h516M540 604v18m-5-5 5 5 5-5" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="36" y="624" width="1008" height="110" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="36" y="624" width="6" height="110" fill="#171717" clip-path="url(#cconv)"/><text x="60" y="656" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Khớp sai lệch cùng cửa sổ  →  Giám sát toàn vẹn (/arena)</text><text x="60" y="686" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Neo tỷ lệ khớp, token suy luận và dấu vân tay của nhóm vào mốc chuẩn chính hãng;</text><text x="60" y="708" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">công bố kèm cỡ mẫu và nhiều cửa sổ liên tiếp, không kết luận vội từ một lần thử.</text></svg>
