r, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#171717" text-anchor="start">La brecha se mantiene acotada; se descarta fallo propio del relay.</text><rect x="552" y="150" width="492" height="360" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="572" y="170" width="96" height="24" rx="6" fill="#fdf4e4" stroke="#ebd4a7"/><text x="620" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#925e12" text-anchor="middle">CASO B</text><text x="678" y="188" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="17" font-weight="600" fill="#171717" text-anchor="start">Sustitución o recorte en el relay</text><line x1="644" y1="222" x2="1012" y2="222" stroke="#e3e8ee" stroke-dasharray="3 3"/><line x1="644" y1="260" x2="1012" y2="260" stroke="#e3e8ee" stroke-dasharray="3 3"/><line x1="644" y1="298" x2="1012" y2="298" stroke="#e3e8ee" stroke-dasharray="3 3"/><line x1="644" y1="334" x2="1012" y2="334" stroke="#e3e8ee" stroke-dasharray="3 3"/><text x="574" y="232" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#697386" text-anchor="start">Alta</text><text x="574" y="282" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#425466" text-anchor="start">Ajuste</text><text x="574" y="334" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#697386" text-anchor="start">Baja</text><text x="654" y="352" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="500" fill="#697386" text-anchor="middle">T1</text><text x="742" y="352" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="500" fill="#697386" text-anchor="middle">T2</text><text x="830" y="352" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="500" fill="#697386" text-anchor="middle">T3</text><text x="918" y="352" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="500" fill="#697386" text-anchor="middle">T4</text><text x="1006" y="352" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="500" fill="#697386" text-anchor="middle">T5</text><polygon points="742,246 830,246 918,248 1006,246 1006,316 918,308 830,290 742,253" fill="#fbeceb" fill-opacity="0.72"/><polyline points="654,246 742,246 830,246 918,248 1006,246" fill="none" stroke="#159570" stroke-width="2.4"/><polyline points="654,252 742,253 830,290 918,308 1006,316" fill="none" stroke="#B7791F" stroke-width="2.4"/><circle cx="654" cy="246" r="3.5" fill="#159570"/><circle cx="742" cy="246" r="3.5" fill="#159570"/><circle cx="830" cy="246" r="3.5" fill="#159570"/><circle cx="918" cy="248" r="3.5" fill="#159570"/><circle cx="1006" cy="246" r="3.5" fill="#159570"/><circle cx="654" cy="252" r="3.5" fill="#ffffff" stroke="#B7791F" stroke-width="2"/><circle cx="742" cy="253" r="3.5" fill="#ffffff" stroke="#B7791F" stroke-width="2"/><circle cx="830" cy="290" r="3.5" fill="#ffffff" stroke="#B7791F" stroke-width="2"/><circle cx="918" cy="308" r="3.5" fill="#ffffff" stroke="#B7791F" stroke-width="2"/><circle cx="1006" cy="316" r="3.5" fill="#ffffff" stroke="#B7791F" stroke-width="2"/><rect x="572" y="366" width="452" height="62" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><text x="584" y="384" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#425466" text-anchor="start">Tokens de razonamiento (caen desde T3)</text><re