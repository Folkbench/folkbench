<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="594" viewBox="0 0 1080 594" role="img" aria-labelledby="title"><title id="title">Cómo distinguir variación del proveedor de un fallo del relay</title><rect width="1080" height="594" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">FIG 04 · SEÑALES DE CALIBRACIÓN</text><rect x="706" y="30" width="338" height="28" rx="14" fill="#f1f4f8" stroke="#c5cfdb"/><text x="875" y="48" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="600" fill="#425466" text-anchor="middle">Esquema ilustrativo · No son datos reales</text><text x="36" y="90" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Cómo distinguir variación del proveedor de un fallo del relay</text><text x="36" y="122" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">Sin referencia oficial simultánea, una caída porcentual resulta imposible de atribuir con rigor.</text><rect x="36" y="150" width="492" height="360" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="56" y="170" width="96" height="24" rx="6" fill="#e9f7f2" stroke="#b7e4d5"/><text x="104" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#146c50" text-anchor="middle">CASO A</text><text x="162" y="188" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="17" font-weight="600" fill="#171717" text-anchor="start">Cambio oficial o dificultad de lote</text><line x1="128" y1="222" x2="496" y2="222" stroke="#e3e8ee" stroke-dasharray="3 3"/>