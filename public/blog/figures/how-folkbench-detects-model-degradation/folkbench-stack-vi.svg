<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title"><title id="title">Từ bảng xếp hạng tĩnh tới kiểm chứng chất lượng giao hàng liên tục</title><rect width="1080" height="610" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">HÌNH 05 · CHUỖI KHÉP KÍN FOLKBENCH</text><text x="36" y="86" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Từ bảng xếp hạng tĩnh tới kiểm chứng chất lượng giao hàng liên tục</text><text x="36" y="118" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">Kết nối xếp hạng theo nhóm dịch vụ, giám sát giảm trí, đối chiếu trạm và chuyển tuyến an toàn.</text><rect x="36" y="144" width="1008" height="78" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="52" y="156" width="276" height="54" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><text x="66" y="179" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="600" fill="#425466" text-anchor="start">Bảng xếp hạng mô hình</text><text x="66" y="199" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#697386" text-anchor="start">Chỉ đo trần lý thuyết bản gốc</text><rect x="342" y="156" width="276" height="54" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><text x="356" y="179" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="600" fill="#425466" text-anchor="start">Danh bạ &amp; ping cơ bản</text><text x="356" y="199" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#697386" text-anchor="start">Chỉ xem giá niêm yết &amp; HTTP 200</text><path d="M630 183h24m-5-5 5 5-5 5" stroke="#171717" stroke-width="1.8" fill="none"/><rect x="666" y="156" width="362" height="54" rx="8" fill="#171717"/><text x="682" y="179" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Kiểm chứng thực tế Folkbench</text><text x="682" y="199" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#d4dee9" text-anchor="start">Giám sát liên tục tới từng Mô hình × Nhóm dịch vụ</text><rect x="36" y="244" width="234" height="276" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="52" y="262" width="166" height="22" rx="6" fill="#f1f4f8"/><text x="60" y="277" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#425466" text-anchor="start">01 · SÀNG LỌC</text><text x="52" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">4 Bảng xếp hạng</text><text x="52" y="336" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#697386" text-anchor="start">/rankings*</text><line x1="52" y1="352" x2="254" y2="352" stroke="#e3e8ee"/><text x="52" y="378" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Khả dụng: loại bỏ lỗi 200 giả</text><text x="52" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Ổn định: chịu tải dài &amp; giờ cao điểm</text><text x="52" y="440" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Tốc độ: tách TTFT và tốc độ sinh</text><text x="52" y="471" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Chi phí phiên: mô phỏng tác vụ thật</text><path d="M273 382h16m-4-4 4 4-4 4" stroke="#87909f" stroke-width="1.5" fill="none"/><rect x="294" y="244" width="234" height="276" rx="12" fill="#ffffff" stroke="#533AFD" stroke-width="1.5"/><defs><clipPath id="cp2"><rect x="294" y="244" width="234" height="276" rx="12"/></clipPath></defs><rect x="294" y="244" width="234" height="4" fill="#533AFD" clip-path="url(#cp2)"/><rect x="310" y="262" width="166" height="22" rx="6" fill="#efedff"/><text x="318" y="277" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="start">02 · KIỂM TRA  NEW</text><text x="310" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Giám sát toàn vẹn</text><text x="310" y="336" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#697386" text-anchor="start">/arena</text><line x1="310" y1="352" x2="512" y2="352" stroke="#e3e8ee"/><text x="310" y="378" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Probe thời sự chặn cache tĩnh</text><text x="310" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Dấu vân tay &amp; token suy luận</text><text x="310" y="440" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Hiệu chuẩn bằng key chính hãng</text><text x="310" y="471" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Nêu rõ cỡ mẫu &amp; cửa sổ đo</text><path d="M531 382h16m-4-4 4 4-4 4" stroke="#87909f" stroke-width="1.5" fill="none"/><rect x="552" y="244" width="234" height="276" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="568" y="262" width="166" height="22" rx="6" fill="#f1f4f8"/><text x="576" y="277" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#425466" text-anchor="start">03 · ĐỐI CHIẾU</text><text x="568" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">So sánh trạm</text><text x="568" y="336" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#697386" text-anchor="start">/stations/compare</text><line x1="568" y1="352" x2="770" y2="352" stroke="#e3e8ee"/><text x="568" y="378" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Đối chiếu song song từng nhóm</text><text x="568" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Tách riêng nhóm cao cấp và giá rẻ</text><text x="568" y="440" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Không bị điểm chung che mờ</text><path d="M789 382h16m-4-4 4 4-4 4" stroke="#87909f" stroke-width="1.5" fill="none"/><rect x="810" y="244" width="234" height="276" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="826" y="262" width="166" height="22" rx="6" fill="#f1f4f8"/><text x="834" y="277" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#425466" text-anchor="start">04 · CHUYỂN TUYẾN</text><text x="826" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Folkbench Switch</text><text x="826" y="336" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="12" font-weight="500" fill="#697386" text-anchor="start">Ứng dụng nguồn mở</text><line x1="826" y1="352" x2="1028" y2="352" stroke="#e3e8ee"/><text x="826" y="378" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Xem trước diff trước khi ghi tệp</text><text x="826" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Bảo vệ xác thực OAuth Codex</text><text x="826" y="440" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="400" fill="#425466" text-anchor="start">• Duyệt tuyến &amp; ước tính cục bộ</text><rect x="36" y="536" width="1008" height="48" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><text x="52" y="565" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="500" fill="#425466" text-anchor="start">Ranh giới hệ thống: Giám sát toàn vẹn và kiểm tra cache chạy trên nền web Folkbench; Switch đảm nhận cấu hình cục bộ và xem tuyến công khai.</text></svg>
