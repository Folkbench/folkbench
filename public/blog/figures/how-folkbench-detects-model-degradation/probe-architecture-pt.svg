<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="766" viewBox="0 0 1080 766" role="img" aria-labelledby="title"><title id="title">Sondas de atualidade e impressão digital com calibração oficial</title><rect width="1080" height="766" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">FIG 03 · ARQUITETURA DE SONDAS DUPLAS</text><text x="36" y="86" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Sondas de atualidade e impressão digital com calibração oficial</text><text x="36" y="118" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">Validação simultânea de compreensão recente e telemetria de protocolo na mesma janela.</text><defs><clipPath id="cd1"><rect x="36" y="146" width="492" height="204" rx="12"/></clipPath><clipPath id="cd2"><rect x="552" y="146" width="492" height="204" rx="12"/></clipPath><clipPath id="cconv"><rect x="36" y="624" width="1008" height="110" rx="12"/></clipPath></defs><rect x="36" y="146" width="492" height="204" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="36" y="146" width="492" height="4" fill="#533AFD" clip-path="url(#cd1)"/><rect x="56" y="166" width="300" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="66" y="182" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="start">DIMENSÃO 01 · ATUALIZAÇÃO CONTÍNUA</text><text x="56" y="218" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">Sondas de atualidade</text><text x="56" y="246" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Incorporam cronologias reais recentes e novas</text><text x="56" y="268" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">condições em tarefas lógicas estruturadas.</text><rect x="56" y="296" width="220" height="36" rx="7" fill="#f7f9fc" stroke="#e3e8ee"/><text x="166" y="318" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#171717" text-anchor="middle">Bloqueia cache e listas brancas</text><rect x="288" y="296" width="220" height="36" rx="7" fill="#f7f9fc" stroke="#e3e8ee"/><text x="398" y="318" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#171717" text-anchor="middle">Expõe versões antigas e cortes</text><rect x="552" y="146" width="492" height="204" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="552" y="146" width="492" height="4" fill="#533AFD" clip-path="url(#cd2)"/><rect x="572" y="166" width="300" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="582" y="182" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="start">DIMENSÃO 02 · HÁBITO E TELEMETRIA</text><text x="572" y="218" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">Sondas de impressão digital</text><text x="572" y="244" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Avaliam disciplina multi-etapa em conjunto com</text><text x="572" y="265" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">sinais técnicos devolvidos pela API:</text><rect x="572" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="644.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Concordância</text><rect x="726" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="798.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Tokens entrada</text><rect x="880" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="952.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Tokens racioc.</text><rect x="572" y="310" width="220" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="682.0" y="327" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Impressão dig.</text><rect x="804" y="310" width="220" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="914.0" y="327" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Checagem cache</text><path d="M282 350v22M798 350v22M282 372h516" stroke="#87909f" stroke-width="1.5" fill="none"/><path d="M282 372v36m-5-6 5 6 5-6" stroke="#159570" stroke-width="1.7" fill="none"/><path d="M798 372v36m-5-6 5 6 5-6" stroke="#425466" stroke-width="1.7" fill="none"/><rect x="332" y="357" width="416" height="30" rx="15" fill="#171717"/><text x="540" y="376" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">MESMA JANELA DE TESTE · ENVIO PARALELO</text><rect x="36" y="414" width="492" height="174" rx="12" fill="#f3fbf8" stroke="#9ad8c4" stroke-width="1.3"/><rect x="56" y="432" width="246" height="22" rx="6" fill="#159570"/><text x="66" y="447" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">TRILHO OFICIAL</text><text x="56" y="480" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">Chaves API oficiais diretas</text><rect x="56" y="496" width="136" height="40" rx="8" fill="#ffffff" stroke="#9ad8c4"/><text x="124.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#146c50" text-anchor="middle">Chave direta</text><path d="M192 516h20m-4-4 4 4-4 4" stroke="#159570" stroke-width="1.5" fill="none"/><rect x="214" y="496" width="136" height="40" rx="8" fill="#ffffff" stroke="#9ad8c4"/><text x="282.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#146c50" text-anchor="middle">API do provedor</text><path d="M350 516h20m-4-4 4 4-4 4" stroke="#159570" stroke-width="1.5" fill="none"/><rect x="372" y="496" width="136" height="40" rx="8" fill="#e9f7f2" stroke="#9ad8c4"/><text x="440.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#146c50" text-anchor="middle">Baseline ao vivo</text><text x="56" y="568" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#146c50" text-anchor="start">Ignora relays intermediários para obter a linha de base oficial.</text><rect x="552" y="414" width="492" height="174" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="572" y="432" width="246" height="22" rx="6" fill="#425466"/><text x="582" y="447" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">TRILHO CANDIDATO</text><text x="572" y="480" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">Rota de relay (Modelo × Grupo)</text><rect x="572" y="496" width="136" height="40" rx="8" fill="#f7f9fc" stroke="#c5cfdb"/><text x="640.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Mesma sonda</text><path d="M708 516h20m-4-4 4 4-4 4" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="730" y="496" width="136" height="40" rx="8" fill="#f7f9fc" stroke="#c5cfdb"/><text x="798.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Rota do grupo</text><path d="M866 516h20m-4-4 4 4-4 4" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="888" y="496" width="136" height="40" rx="8" fill="#ffffff" stroke="#c5cfdb"/><text x="956.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Saída + sinais</text><text x="572" y="568" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#425466" text-anchor="start">Medida isolada por modelo e grupo, sem médias globais.</text><path d="M282 588v16M798 588v16M282 604h516M540 604v18m-5-5 5 5 5-5" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="36" y="624" width="1008" height="110" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="36" y="624" width="6" height="110" fill="#171717" clip-path="url(#cconv)"/><text x="60" y="656" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Alinhamento diferencial na mesma janela  →  Monitor de Integridade (/arena)</text><text x="60" y="686" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Ancora concordância, tokens de raciocínio e impressão digital na baseline ao vivo;</text><text x="60" y="708" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">expõe tamanho amostral e janelas consecutivas sem acusações por caso isolado.</text></svg>
