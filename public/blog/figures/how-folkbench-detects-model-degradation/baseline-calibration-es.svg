ke="#3A3C37" stroke-width="1"/><circle cx="886" cy="267" r="3.5" fill="#34D399"/><text x="897" y="272" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F4F4EF" text-anchor="start">Concordancia Δ</text><rect x="872" y="290" width="138" height="30" rx="6" fill="#222320" stroke="#3A3C37" stroke-width="1"/><circle cx="886" cy="305" r="3.5" fill="#818CF8"/><text x="897" y="310" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F4F4EF" text-anchor="start">Razonamiento Δ</text><rect x="872" y="328" width="138" height="30" rx="6" fill="#222320" stroke="#3A3C37" stroke-width="1"/><circle cx="886" cy="343" r="3.5" fill="#FBBF24"/><text x="897" y="348" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F4F4EF" text-anchor="start">Huella y caché</text><rect x="416" y="388" width="608" height="50" rx="8" fill="#F7F9FC" stroke="#DAE1E9" stroke-width="1"/><text x="432" y="418" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#171717" text-anchor="start">El delta relativo aísla la deriva: los cambios del lab mueven ambos; los recortes del relay divergen.</text></svg>
