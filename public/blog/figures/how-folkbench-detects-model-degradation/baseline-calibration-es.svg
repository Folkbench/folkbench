<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="492" viewBox="0 0 1080 492" role="img" aria-labelledby="title"><title id="title">Cómo las claves oficiales convierten cifras aisladas en referencia viva</title><rect width="1080" height="492" fill="#f6f6f3"/><defs>  <clipPath id="clipRightCard"><rect x="396" y="136" width="648" height="320" rx="12"/></clipPath></defs><text x="36" y="46" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">MECANISMO DE CALIBRACIÓN · DOBLE CARRIL</text><text x="36" y="82" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="700" fill="#171717" text-anchor="start">Cómo las claves oficiales convierten cifras aisladas en referencia viva</text><text x="36" y="108" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#425466" text-anchor="start">Ejecutar claves oficiales directas junto a cada relay en la misma ventana separa las causas reales.</text><rect x="36" y="136" width="322" height="320" rx="12" fill="#FFFFFF" stroke="#DAE1E9" stroke-width="1.25"/><rect x="54" y="154" width="218" height="28" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="0.9"/><text x="66" y="173" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="700" fill="#92400E" text-anchor="start">SIN REFERENCIA · UN CARRIL</text><rect x="54" y="196" width="286" height="176" rx="9" fill="#F7F9FC" stroke="#E3E8EE" stroke-width="1"/><rect x="70" y="210" width="254" height="34" rx="7" fill="#FFFFFF" stroke="#C5CFDB" stroke-width="1.1"/><circle cx="88" cy="227" r="5" fill="#B7791F"/><text x="102" y="232" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#171717" text-anchor="start">Cae el puntaje del relay</text><line x1="197" y1="244" x2="197" y2="262" stroke="#87909F" stroke-width="1.5"/><polygon points="193,260 201,260 197,267" fill="#87909F"/><text x="72" y="286" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#697386" text-anchor="start">Origen ambiguo:</text><rect x="70" y="296" width="254" height="28" rx="6" fill="#FFFFFF" stroke="#DAE1E9" stroke-dasharray="4 3" stroke-width="1"/><text x="80" y="314" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="500" fill="#425466" text-anchor="start">? Cambio oficial o dificultad del lote</text><rect x="70" y="330" width="254" height="28" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-dasharray="4 3" stroke-width="1"/><text x="80" y="348" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="500" fill="#991B1B" text-anchor="start">? O desvío / recorte en el relay</text><rect x="54" y="384" width="286" height="54" rx="8" fill="#F8FAFC" stroke="#E3E8EE" stroke-width="1"/><text x="68" y="407" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="500" fill="#425466" text-anchor="start">Sin un ancla oficial simultánea,</text><text x="68" y="425" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="start">un puntaje aislado induce falsas alertas.</text><line x1="362" y1="296" x2="386" y2="296" stroke="#171717" stroke-width="2"/><polygon points="384,291 394,296 384,301" fill="#171717"/><rect x="396" y="136" width="648" height="320" rx="12" fill="#FFFFFF" stroke="#171717" stroke-width="1.5"/><rect x="396" y="136" width="648" height="5" fill="#111211" clip-path="url(#clipRightCard)"/><rect x="416" y="153" width="330" height="28" rx="6" fill="#111211"/><text x="430" y="172" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">CALIBRACIÓN DOBLE CARRIL · VENTANA W_t</text><rect x="416" y="194" width="420" height="84" rx="10" fill="#ECFDF5" stroke="#159570" stroke-width="1.5"/><text x="432" y="216" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065F46" text-anchor="start">Carril Oficial Directo (Sin Intermediarios)</text><rect x="432" y="228" width="112" height="36" rx="7" fill="#FFFFFF" stroke="#159570" stroke-width="1"/><text x="488" y="251" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle">Clave aislada</text><text x="555" y="250" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#159570" text-anchor="middle">→</text><rect x="566" y="228" width="114" height="36" rx="7" fill="#FFFFFF" stroke="#159570" stroke-width="1"/><text x="623" y="251" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle">API oficial</text><text x="691" y="250" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#159570" text-anchor="middle">→</text><rect x="702" y="228" width="118" height="36" rx="7" fill="#159570"/><text x="761" y="251" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Base viva</text><rect x="416" y="290" width="420" height="84" rx="10" fill="#F8FAFC" stroke="#533AFD" stroke-width="1.4"/><text x="432" y="312" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E1B4B" text-anchor="start">Carril del Relay (Por Modelo × Grupo)</text><rect x="432" y="32