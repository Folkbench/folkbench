<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="588" viewBox="0 0 1080 588" role="img" aria-labelledby="title"><title id="title">HTTP 200이 정상이어도 모델 성능 저하를 놓치는 이유</title><rect width="1080" height="588" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, &#x27;Noto Sans CJK KR&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, Roboto, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">그림 01 · 기존 모니터링의 사각지대</text><text x="36" y="86" font-family="Inter, &#x27;Noto Sans CJK KR&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, Roboto, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">HTTP 200이 정상이어도 모델 성능 저하를 놓치는 이유</text><text x="36" y="118" font-family="Inter, &#x27;Noto Sans CJK KR&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, Roboto, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">단순 접속 및 지연 시간 체크만으로는 중계 계층 내부의 모델 교체나 추론 삭감을 감지할 수 없습니다.</text><rect x="36" y="144" width="1008" height="72" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><circle cx="62" cy="180" r="6" fill="#159570"/><circle cx="62" cy="180" r="10" fill="none" stroke="#159570" stroke-opacity="0.28" stroke-width="1.5"/><text x="84" y="185" font-family="Inter, &#x27;Noto Sans CJK KR&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, Roboto, sans-serif" font-size="16" font-weight="600" fill="#171717" text-anchor="start">일반 모니터링이 보는 표면 지표 (모두 정상)</text><rect x="574" y="162" width="140" height="36" rx="8" fill="#e9f7f2" stroke="#b7e4d5" stroke-width="1"/><text x="644.0" y="185" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="13" font-weight="600" fill="#146c50" text-anchor="middle">HTTP 200 OK</text><rect x="732" y="162" width="140" height="36" rx="8" fill="#e9f7f2" stroke="#b7e4d5" stroke-width="1"/><text x="802.0" y="185" font-family="Inter, &#x27;Noto Sans CJK KR&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, Roboto, sans-serif" font-size="13" font-weight="600" fill="#146c50" text-anchor="middle">빠른 첫 토큰</text><rect x="890" y="162" width="140" height="36" rx="8" fill="#e9f7f2" stroke="#b7e4d5" stroke-width="1"/><text x="960.0" y="185" font-family="Inter, &#x27;Noto Sans CJK KR&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, Roboto, sans-serif" font-size="13" font-weight="600" fill="#146c50" text-anchor="middle">매끄러운 문장</text><path d="M540 216v18M196 234h688M196 234v22M540 234v22M884 234v22" stroke="#b9c2cc" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/><rect x="36" y="256" width="320" height="296" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="56" y="274" width="190" height="24" rx="6" fill="#fdf4e4" stroke="#ebd4a7"/><text x="66" y="290" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#925e12" text-anchor="start">유형 01 · 라우팅 변경</text><rect x="56" y="310" width="280" height="114" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><rect x="68" y="347" width="84" height="38" rx="6" fill="#ffffff" stroke="#533AFD" stroke-width="1.5"/><text x="110" y="370" font-family="Inter, &#x27;Noto Sans CJK KR&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, Roboto, sans-serif" font-size="11" font-weight="600" fill="#432dd7" text-anchor="middle">플래그십 요청</text><path d="M152 366h24" stroke="#425466" stroke-width="1.5"/><circle cx="184" cy="366" r="10" fill="#ffffff" stroke="#425466" stroke-width="1.5"/><path d="M180 366h8m-4-4v8" stroke="#425466" stroke-width="1.3"/><path d="M193 360 C208 342, 214 340, 226 340" stroke="#c5cfdb" stroke-width="1.3" stroke-dasharray=