<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="504" viewBox="0 0 1080 504" role="img" aria-labelledby="title"><title id="title">Why Common Manual Self-Checks Break Down on Relays</title><rect width="1080" height="504" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">FIG 02 · BYPASS PATTERNS</text><text x="36" y="86" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Why Common Manual Self-Checks Break Down on Relays</text><text x="36" y="118" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">Simple identity prompts and static test questions are easily absorbed by modern proxy logic.</text><rect x="36" y="148" width="492" height="320" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="56" y="168" width="94" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="103" y="184" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="middle">CHECK 01</text><text x="162" y="186" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Asking the Model Its Own Name</text><rect x="56" y="206" width="452" height="162" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><rect x="66" y="236" width="116" height="58" rx="8" fill="#ffffff" stroke="#425466" stroke-width="1.3"/><text x="124" y="259" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">User Prompt</text><text x="124" y="279" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#697386" text-anchor="middle">&quot;Which model?&quot;</text><path d="M182 265h14m-4-4 4 4-4 4" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="198" y="220" width="160" height="66" rx="8" fill="#fbeceb" stroke="#efc5c2" stroke-width="1.4"/><text x="278" y="245" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#a3281e" text-anchor="middle">Gateway Injection</text><text x="278" y="267" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#a3281e" text-anchor="middle">System prompt label</text><rect x="210" y="302" width="136" height="44" rx="6" fill="#ffffff" stroke="#c5cfdb" stroke-dasharray="3 3"/><text x="278" y="329" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#697386" text-anchor="middle">Any backend weights</text><path d="M278 286v15" stroke="#c5cfdb" stroke-width="1.3" stroke-dasharray="2 2"/><path d="M358 253h14m-4-4 4 4-4 4" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="374" y="236" width="124" height="58" rx="8" fill="#ffffff" stroke="#425466" stroke-width="1.3"/><text x="436" y="259" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Output Text</text><text x="436" y="279" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#a3281e" text-anchor="middle">Claims target name</text><rect x="56" y="382" width="452" height="66" rx="8" fill="#fbeceb" stroke="#efc5c2"/><text x="72" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#7c2018" text-anchor="start">Models cannot inspect proxy routing; self-identification reflects</text><text x="72" y="430" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#7c2018" text-anchor="start">system prompts or memorized phrasing, not active weights.</text><rect x="552" y="148" width="492" height="320" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="572" y="168" width="94" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="619" y="184" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="middle">CHECK 02</text><text x="678" y="186" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Reusing Fixed Public Brainteasers</text><rect x="572" y="206" width="452" height="162" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><rect x="582" y="256" width="104" height="58" rx="8" fill="#ffffff" stroke="#425466" stroke-width="1.3"/><text x="634" y="280" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Static Prompt</text><text x="634" y="300" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#697386" text-anchor="middle">Repeated pattern</text><path d="M686 285h14" stroke="#425466" stroke-width="1.5"/><rect x="700" y="252" width="102" height="66" rx="8" fill="#fdf4e4" stroke="#B7791F" stroke-width="1.4"/><text x="751" y="289" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#925e12" text-anchor="middle">Gateway Filter</text><path d="M802 272 C812 248, 814 245, 824 245" stroke="#159570" stroke-width="1.5" fill="none"/><path d="M802 298 C812 322, 814 325, 824 325" stroke="#B7791F" stroke-width="1.5" fill="none"/><rect x="824" y="218" width="192" height="56" rx="7" fill="#e9f7f2" stroke="#b7e4d5"/><text x="920" y="239" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#146c50" text-anchor="middle">Known check</text><text x="920" y="259" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#171717" text-anchor="middle">Static cache / clean whitelist</text><rect x="824" y="294" width="192" height="56" rx="7" fill="#fdf4e4" stroke="#ebd4a7"/><text x="920" y="315" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#925e12" text-anchor="middle">Daily traffic</text><text x="920" y="335" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#425466" text-anchor="middle">Degraded / throttled pool</text><rect x="572" y="382" width="452" height="66" rx="8" fill="#fdf4e4" stroke="#ebd4a7"/><text x="588" y="409" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6e460c" text-anchor="start">Public puzzles sit in training sets; repeated prompts can be cached</text><text x="588" y="430" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6e460c" text-anchor="start">or routed to clean channels while daily production stays degraded.</text></svg>
