boto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="500" fill="#7c2018" text-anchor="start">zeigen nur System-Prompts oder trainierte Standardphrasen.</text><rect x="552" y="148" width="492" height="320" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="572" y="168" width="94" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="619" y="184" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="middle">TEST 02</text><text x="678" y="186" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Feste öffentliche Rätsel wiederholen</text><rect x="572" y="206" width="452" height="162" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><rect x="582" y="256" width="104" height="58" rx="8" fill="#ffffff" stroke="#425466" stroke-width="1.3"/><text x="634" y="280" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Fester Test</text><text x="634" y="300" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="400" fill="#697386" text-anchor="middle">Feste Signatur</text><path d="M686 285h14" stroke="#425466" stroke-width="1.5"/><rect x="700" y="252" width="102" height="66" rx="8" fill="#fdf4e4" stroke="#B7791F" stroke-width="1.4"/><text x="751" y="289" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#925e12" text-anchor="middle">Gateway-Filter</text><path d="M802 272 C812 248, 814 245, 824 245" stroke="#159570" stroke-width="1.5" fill="none"/><path d="M802 298 C812 322, 814 325, 824 325" stroke="#B7791F" stroke-width="1.5" fill="none"/><rect x="824" y="218" width="192" height="56" rx="7" fill="#e9f7f2" stroke="#b7e4d5"/><text x="92