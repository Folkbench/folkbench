<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="504" viewBox="0 0 1080 504" role="img" aria-labelledby="title"><title id="title">Warum manuelle Selbsttests gegen Proxys oft scheitern</title><rect width="1080" height="504" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">ABB. 02 · TEST-UMGEHUNG</text><text x="36" y="86" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Warum manuelle Selbsttests gegen Proxys oft scheitern</text><text x="36" y="118" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">Einfache Identitätsfragen und feste Rätsel lassen sich leicht maskieren oder cachen.</text><rect x="36" y="148" width="492" height="320" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="56" y="168" width="94" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="103" y="184" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="middle">TEST 01</text><text x="162" y="186" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Direkte Frage nach dem Modellnamen</text><rect x="56" y="206" width="452" height="162" rx="8" fill="#f7f9fc" stroke="#e3e8ee"/><rect x="66" y="236" width="116" height="58" rx="8" fill="#ffffff" stroke="#425466" stroke-width="1.3"/><text x="124" y="259" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Prompt</text><text x="124" y="279" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, s