<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="766" viewBox="0 0 1080 766" role="img" aria-labelledby="title"><title id="title">Зонды актуальности и отпечатка с прямой эталонной калибровкой</title><rect width="1080" height="766" fill="#f6f6f3"/><text x="36" y="48" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="600" fill="#697386" text-anchor="start" letter-spacing="0.08em">РИС. 03 · ДВУМЕРНАЯ АРХИТЕКТУРА</text><text x="36" y="86" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="27" font-weight="600" fill="#171717" text-anchor="start">Зонды актуальности и отпечатка с прямой эталонной калибровкой</text><text x="36" y="118" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#425466" text-anchor="start">Параллельная проверка актуального понимания и телеметрии протокола в одном окне.</text><defs><clipPath id="cd1"><rect x="36" y="146" width="492" height="204" rx="12"/></clipPath><clipPath id="cd2"><rect x="552" y="146" width="492" height="204" rx="12"/></clipPath><clipPath id="cconv"><rect x="36" y="624" width="1008" height="110" rx="12"/></clipPath></defs><rect x="36" y="146" width="492" height="204" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="36" y="146" width="492" height="4" fill="#533AFD" clip-path="url(#cd1)"/><rect x="56" y="166" width="300" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="66" y="182" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="start">ИЗМЕРЕНИЕ 01 · ПОСТОЯННОЕ ОБНОВЛЕНИЕ</text><text x="56" y="218" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">Зонды актуальности</text><text x="56" y="246" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Включают свежие события и новые условия в</text><text x="56" y="268" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">многошаговые логические задания без шаблонов.</text><rect x="56" y="296" width="220" height="36" rx="7" fill="#f7f9fc" stroke="#e3e8ee"/><text x="166" y="318" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#171717" text-anchor="middle">Блок кеша и белых списков</text><rect x="288" y="296" width="220" height="36" rx="7" fill="#f7f9fc" stroke="#e3e8ee"/><text x="398" y="318" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="500" fill="#171717" text-anchor="middle">Выявляет старые версии и сжатие</text><rect x="552" y="146" width="492" height="204" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="552" y="146" width="492" height="4" fill="#533AFD" clip-path="url(#cd2)"/><rect x="572" y="166" width="300" height="24" rx="6" fill="#efedff" stroke="#cbc4ff"/><text x="582" y="182" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#432dd7" text-anchor="start">ИЗМЕРЕНИЕ 02 · ПОВЕДЕНИЕ И ТЕЛЕМЕТРИЯ</text><text x="572" y="218" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717" text-anchor="start">Зонды отпечатка модели</text><text x="572" y="244" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Фиксируют привычки соблюдения ограничений и</text><text x="572" y="265" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">ключевые показатели протокола ответа:</text><rect x="572" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="644.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Совпадение</text><rect x="726" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="798.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Вход. токены</text><rect x="880" y="276" width="144" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="952.0" y="293" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Токены рассужд.</text><rect x="572" y="310" width="220" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="682.0" y="327" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Отпечаток</text><rect x="804" y="310" width="220" height="26" rx="6" fill="#f7f9fc" stroke="#dae1e9"/><text x="914.0" y="327" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="11" font-weight="600" fill="#171717" text-anchor="middle">Проверка кеша</text><path d="M282 350v22M798 350v22M282 372h516" stroke="#87909f" stroke-width="1.5" fill="none"/><path d="M282 372v36m-5-6 5 6 5-6" stroke="#159570" stroke-width="1.7" fill="none"/><path d="M798 372v36m-5-6 5 6 5-6" stroke="#425466" stroke-width="1.7" fill="none"/><rect x="332" y="357" width="416" height="30" rx="15" fill="#171717"/><text x="540" y="376" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">ОДНО ВРЕМЕННОЕ ОКНО · СИНХРОННЫЙ ЗАПУСК</text><rect x="36" y="414" width="492" height="174" rx="12" fill="#f3fbf8" stroke="#9ad8c4" stroke-width="1.3"/><rect x="56" y="432" width="246" height="22" rx="6" fill="#159570"/><text x="66" y="447" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">ЭТАЛОННЫЙ КОНТУР</text><text x="56" y="480" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">Независимые прямые API-ключи</text><rect x="56" y="496" width="136" height="40" rx="8" fill="#ffffff" stroke="#9ad8c4"/><text x="124.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#146c50" text-anchor="middle">Прямой ключ</text><path d="M192 516h20m-4-4 4 4-4 4" stroke="#159570" stroke-width="1.5" fill="none"/><rect x="214" y="496" width="136" height="40" rx="8" fill="#ffffff" stroke="#9ad8c4"/><text x="282.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#146c50" text-anchor="middle">API вендора</text><path d="M350 516h20m-4-4 4 4-4 4" stroke="#159570" stroke-width="1.5" fill="none"/><rect x="372" y="496" width="136" height="40" rx="8" fill="#e9f7f2" stroke="#9ad8c4"/><text x="440.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#146c50" text-anchor="middle">Живой эталон</text><text x="56" y="568" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#146c50" text-anchor="start">Прямой вызов без посредников задаёт живую точку отсчёта.</text><rect x="552" y="414" width="492" height="174" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="572" y="432" width="246" height="22" rx="6" fill="#425466"/><text x="582" y="447" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, &#x27;DejaVu Sans Mono&#x27;, monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="start">ПРОВЕРЯЕМЫЙ КОНТУР</text><text x="572" y="480" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="19" font-weight="600" fill="#171717" text-anchor="start">API-прокси (Модель × Сервис-группа)</text><rect x="572" y="496" width="136" height="40" rx="8" fill="#f7f9fc" stroke="#c5cfdb"/><text x="640.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Тот же зонд</text><path d="M708 516h20m-4-4 4 4-4 4" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="730" y="496" width="136" height="40" rx="8" fill="#f7f9fc" stroke="#c5cfdb"/><text x="798.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Маршрут группы</text><path d="M866 516h20m-4-4 4 4-4 4" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="888" y="496" width="136" height="40" rx="8" fill="#ffffff" stroke="#c5cfdb"/><text x="956.0" y="520" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="12" font-weight="600" fill="#171717" text-anchor="middle">Ответ + метрики</text><text x="572" y="568" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="13" font-weight="400" fill="#425466" text-anchor="start">Отдельный замер по модели и группе без усреднения по сайту.</text><path d="M282 588v16M798 588v16M282 604h516M540 604v18m-5-5 5 5 5-5" stroke="#425466" stroke-width="1.5" fill="none"/><rect x="36" y="624" width="1008" height="110" rx="12" fill="#ffffff" stroke="#dae1e9" stroke-width="1.2"/><rect x="36" y="624" width="6" height="110" fill="#171717" clip-path="url(#cconv)"/><text x="60" y="656" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="18" font-weight="600" fill="#171717" text-anchor="start">Синхронное дифференциальное выравнивание  →  Монитор целостности (/arena)</text><text x="60" y="686" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">Сопоставляет совпадение зондов, токены рассуждений и отпечаток с прямой базой;</text><text x="60" y="708" font-family="Inter, Roboto, &#x27;DejaVu Sans&#x27;, system-ui, sans-serif" font-size="14" font-weight="400" fill="#425466" text-anchor="start">указывает объём выборки и ряд окон вместо поспешных выводов по одному ответу.</text></svg>
